<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/wayfare-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayfare - Authentic Travel Stories</title>
    <!-- Google Fonts: Inter with crisp Vietnamese support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Mobile OAuth Redirect Bridge: Chuyển tiếp token từ Google OAuth về ứng dụng Wayfare Mobile -->
    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          if (hash.indexOf('access_token=') !== -1 || hash.indexOf('id_token=') !== -1) {
            var searchParams = new URLSearchParams(hash.substring(1));
            var token = searchParams.get('id_token') || searchParams.get('access_token');
            var rawState = searchParams.get('state');

            // 1. Nếu mở từ popup web (Expo Web / localhost:8081 / browser):
            if (window.opener && token) {
              try {
                window.opener.postMessage({
                  type: 'WAYFARE_GOOGLE_AUTH_SUCCESS',
                  token: token,
                  hash: hash
                }, '*');
                window.close();
                return;
              } catch (e) {
                console.warn('Popup postMessage error:', e);
              }
            }

            // 2. Nếu mở từ native mobile: Chuyển tiếp deep link về app
            var targetScheme = 'wayfare://oauth';
            if (rawState) {
              try {
                var decoded = decodeURIComponent(rawState);
                if (decoded.indexOf('://') !== -1) {
                  targetScheme = decoded;
                }
              } catch (e) {}
            }
            var separator = targetScheme.indexOf('?') !== -1 ? '&' : (targetScheme.indexOf('#') !== -1 ? '&' : '#');
            var redirectTarget = targetScheme + separator + hash.substring(1);
            window.location.replace(redirectTarget);
          }
        } catch (err) {
          console.warn('OAuth redirect bridge error', err);
        }
      })();
    </script>
    <!-- Google Identity Services (OAuth 2.0 Sign-In) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-serif subpixel-antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
