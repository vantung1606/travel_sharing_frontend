<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/wayfare-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayfare - Authentic Travel Stories</title>
    <!-- Google Fonts: Inter with crisp Vietnamese support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Mobile OAuth Redirect Bridge: Chuyển tiếp token từ Google OAuth về ứng dụng Wayfare Mobile -->
    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          var fragment = (hash.indexOf('access_token=') !== -1 || hash.indexOf('id_token=') !== -1)
            ? hash.substring(1)
            : ((search.indexOf('access_token=') !== -1 || search.indexOf('id_token=') !== -1) ? search.substring(1) : '');

          if (!fragment) return;

          var searchParams = new URLSearchParams(fragment);
          var token = searchParams.get('id_token') || searchParams.get('access_token');

          // 1. Nếu mở từ popup web (Expo Web / localhost:8081 / browser):
          if (window.opener && token) {
            try {
              window.opener.postMessage({
                type: 'WAYFARE_GOOGLE_AUTH_SUCCESS',
                token: token,
                hash: hash
              }, '*');
              setTimeout(function() { window.close(); }, 300);
              return;
            } catch (e) {
              console.warn('Popup postMessage error:', e);
            }
          }

          // 2. Chuyển tiếp an toàn sang trang oauth-bridge chuyên dụng xử lý Native Deep Link
          window.location.replace('/oauth-bridge.html' + (hash ? hash : ('#' + fragment)));
        } catch (err) {
          console.warn('OAuth redirect check error', err);
        }
      })();
    </script>
    <!-- Google Identity Services (OAuth 2.0 Sign-In) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-serif subpixel-antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
