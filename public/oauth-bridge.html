<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayfare Google OAuth Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FAF8F5;
      color: #1E1A15;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E8E2D9;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    .logo {
      font-size: 26px;
      font-weight: 800;
      color: #C07040;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(192, 112, 64, 0.2);
      border-top-color: #C07040;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 15px;
      font-weight: 600;
      color: #2D2721;
      margin: 12px 0 6px 0;
    }
    .subtext {
      font-size: 13px;
      color: #7D7368;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      background: #C07040;
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Wayfare</div>
    <div id="spinner" class="spinner"></div>
    <div id="status" class="status">Đang mở xác thực Google...</div>
    <div id="subtext" class="subtext">Vui lòng chọn tài khoản Google của bạn để đăng nhập vào Wayfare.</div>
    <button id="retryBtn" class="btn" style="display:inline-block;" onclick="redirectToGoogle()">Chọn tài khoản Google</button>
  </div>

  <script>
    var clientId = '340055145050-thlfrv3nl1j1jcahh75n8inr8v5j4574.apps.googleusercontent.com';

    function notifyOpener(token) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').innerText = '✅ Đăng nhập thành công!';
      document.getElementById('subtext').innerText = 'Đang chuyển kết quả về ứng dụng Wayfare...';
      
      try {
        if (window.opener) {
          window.opener.postMessage({
            type: 'WAYFARE_GOOGLE_AUTH_SUCCESS',
            token: token
          }, '*');
          setTimeout(function() {
            window.close();
          }, 300);
          return;
        }
      } catch (err) {
        console.error('Lỗi khi gửi message về opener:', err);
      }

      // Nếu không có opener (mở từ WebBrowser / Chrome Custom Tabs trên Mobile Native):
      var rawState = new URLSearchParams(window.location.search || window.location.hash.substring(1)).get('state');
      var targetScheme = 'wayfare://oauth';
      if (rawState) {
        try {
          var decoded = decodeURIComponent(rawState);
          if (decoded.indexOf('://') !== -1) targetScheme = decoded;
        } catch (e) {}
      }
      var separator = targetScheme.indexOf('?') !== -1 ? '&' : (targetScheme.indexOf('#') !== -1 ? '&' : '#');
      var redirectTarget = targetScheme + separator + 'access_token=' + encodeURIComponent(token);
      var androidIntent = 'intent://oauth#access_token=' + encodeURIComponent(token) + '#Intent;scheme=wayfare;package=com.wayfare.travelmobile;end;';

      var retryBtn = document.getElementById('retryBtn');
      if (retryBtn) {
        retryBtn.innerText = '🚀 Mở ứng dụng Wayfare ngay';
        retryBtn.style.display = 'inline-block';
        retryBtn.onclick = function() {
          try { window.location.href = androidIntent; } catch(e) {}
          setTimeout(function() { window.location.href = redirectTarget; }, 300);
        };
      }

      try {
        if (/Android/i.test(navigator.userAgent)) {
          window.location.href = androidIntent;
        }
      } catch (e1) {}

      setTimeout(function() {
        try { window.location.replace(redirectTarget); } catch (e2) {}
      }, 200);
    }

    function redirectToGoogle() {
      var params = new URLSearchParams(window.location.search || window.location.hash.substring(1));
      var parentOrigin = params.get('parent') || 'http://localhost:8081';
      var redirectUri = window.location.origin;

      var authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + encodeURIComponent(clientId)
        + '&redirect_uri=' + encodeURIComponent(redirectUri)
        + '&response_type=token%20id_token&scope=openid%20profile%20email&prompt=select_account&state='
        + encodeURIComponent(parentOrigin) + '&nonce=wayfare_' + Date.now();

      window.location.replace(authUrl);
    }

    // Check if redirect response returned in hash or search
    (function checkHash() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var params = new URLSearchParams(hash.substring(1) || search.substring(1));
      var token = params.get('access_token') || params.get('id_token');
      if (token) {
        notifyOpener(token);
        return;
      }

      // Tự động chuyển tiếp đến màn hình Google OAuth chính thức
      setTimeout(redirectToGoogle, 200);
    })();
  </script>
</body>
</html>
